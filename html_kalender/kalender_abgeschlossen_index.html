<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.75">
  <title>Kalenderblatt</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="kalender">
    <h1 id="Mainheadline">Kalenderblatt</h1>
    <p class="obriger_text">
      Der <span id="day1"></span>. <span class="month1"></span> <span id="year1"></span> ist ein <span
        class="weekDays"></span>
      und zwar der
      <span id="weekDayTimes"></span> <span class="weekDays"></span> im Monat <span class="month1"></span>
      des Jahres<span id="year1"></span>. Es handelt sich um den <span id="dayOfYear"></span>. Tag des Jahres, was
      bedeutet,
      dass es noch <span id="remainingDays"></span> Tage bis zum Jahresende sind. Der Monat <span id="month1"></span>
      hat insgesamt <span id="monthlyDays"></span> Tage. <span id="holidays"></span> in Hessen.
    </p>
    <table>
      <thead>
        <tr>
          <th class="montag">Mo</th>
          <th class="dienstag">Di</th>
          <th class="mittwoch">Mi</th>
          <th class="donnerstag">Do</th>
          <th class="freitag">Fr</th>
          <th class="samstag">Sa</th>
          <th class="sonntag">So</th>
        </tr>
      </thead>
      <tbody id="calenderContent">
      </tbody>
    </table>
    <div class="historische_ereignisse">
      <h2>
        <a href="historische_Ereignisse.html">
          Historische Ereignisse
        </a>
      </h2>
      <ul id="historische_ereignisse"></ul>
    </div>
  </div>
  <script src="kalender.js"></script>
</body>

</html>
